[project]
name = "arkdecompiler-mcp"
version = "0.1.0"
description = "MCP server exposing HarmonyOS NEXT (.abc/.hap/.app) decompilation via arkdecompiler's xabc engine"
requires-python = ">=3.10"
dependencies = [
    "mcp>=1.0.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
arkdecompiler-mcp = "arkdecompiler_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["arkdecompiler_mcp"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
